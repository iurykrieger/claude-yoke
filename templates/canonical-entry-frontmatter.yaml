traceability: ""                        # path to a failure or constraint that justified this entry
impact_level: ""                        # low | medium | high | regulatory

# Graph relationships (Sprint 6+ uses these for progressive disclosure)
depends_on: []
supersedes: []
applies_to: []
contradicts_with: []
