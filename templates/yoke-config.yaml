# .yoke/config.yaml — Yoke configuration for this project
# Generated by /yoke:bootstrap.
# Hand-edit only fields under `overrides:`; the rest are managed by Yoke.

yoke_version: "{{ yoke_version }}"
created_at: "{{ created_at }}"

canonical_memory:
  # URL of this project's canonical-memory git repository.
  # If empty, /yoke:ask, /yoke:canonize, and /yoke:drift-sense will not work.
  url: "{{ canonical_memory_url }}"
  # Registered name (lookup key into <plugin_dir>/memories.json).
  # Populated by /yoke:bootstrap on first run; managed by /yoke:memory.
  name: "{{ canonical_memory_name }}"
  default_branch: main

host:
  # Human-readable project name (used as the default seed for actor_name
  # when actor_name is unset). Managed by Yoke; hand-edit only when the
  # canonical actor name in canonical memory should differ from the
  # kebab-case of this value.
  project_name: "{{ host_project_name }}"
  # Canonical actor name for this host project — the actor entity that
  # promoted concepts hang `applies_to:` to and bidirectionally backlink
  # from. Read by `lib/working-memory/host-actor.sh::wm_host_actor_name`.
  # If left empty, that helper auto-derives the kebab-case of project_name
  # (or the CWD basename) and writes the default back here on first use.
  # Used by `lib/canonical-memory/write-promoted-concept.sh` (s01-t03 of
  # the sprint-contract-promotion sprint).
  actor_name: "{{ host_actor_name }}"

overrides:
  # Hard bounds for the ralph loop (defaults baked into Yoke; uncomment to override)
  # hard_bounds:
  #   cycles_max: 8
  #   timeout_seconds: 14400      # 4 hours
  #   token_budget: 200000

  # Canonization criteria thresholds (defaults baked in; uncomment to override)
  # canonization:
  #   repeatability_min: 3
  #   generality_min: 2
  #   stability_min_days: 14

  # Veto window for medium-impact canonization PRs
  # model_c:
  #   veto_window_hours: 24

  # Subgraph traversal depth for /yoke:ask
  # query:
  #   subgraph_depth: 2

  # Per-role / per-mode model selection (perf-quickwins Part 3).
  # The /yoke:implement coordinator resolves each Task call's `model:`
  # value via lib/runtime/agent-config.sh::yoke_resolve_model.
  #
  # Built-in defaults pin Validator + Orchestrator-consult/monitor to a
  # Sonnet-class model (structured-JSON judgment + retrieval over
  # canonical memory tolerate the smaller class). Generator and
  # Orchestrator-canonize inherit the user's session model — quality is
  # king on code generation and on Model C governance writes.
  #
  # Override any value here to pin a specific model identifier.
  # Setting `default:` provides a fallback for generator and
  # orchestrator.canonize when those keys are absent.
  #
  # runtime:
  #   sensor_concurrency: 4              # Part 1 — parallel sensor fanout
  #   models:
  #     default: claude-opus-4-7         # falls through to generator + orchestrator.canonize
  #     generator: claude-opus-4-7       # explicit override; falls back to .default
  #     validator: claude-sonnet-4-6     # structured-JSON judgment over deterministic sensor output
  #     orchestrator:
  #       consult: claude-sonnet-4-6     # subgraph retrieval; progressive disclosure
  #       monitor: claude-sonnet-4-6     # divergence detection on runtime working memory
  #       canonize: claude-opus-4-7      # Model C governance writes — never downgrade
