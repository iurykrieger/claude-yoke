name: CI

# Gates every PR against the framework-shape test suite.
# A `prep` job runs the framework-wide invariants (bash version, JSON
# manifests, SKILL.md frontmatter, shell-script parse). When prep is
# green, a matrix job fans out — one runner per `tests/<concept>.test.sh`
# — so a concept failure is isolated in its own log.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prep:
    name: Framework-wide pre-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify shell is bash 4+
        run: |
          bash --version
          ver=$(bash -c 'echo $BASH_VERSION' | cut -d. -f1)
          if [ "$ver" -lt 4 ]; then
            echo "::error::bash 4+ required, got $ver"
            exit 1
          fi

      - name: Validate JSON manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Verify all SKILL.md frontmatters
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            awk 'BEGIN{c=0; n=0; d=0} /^---$/{c++; next} c==1 && /^name:/{n=1} c==1 && /^description:/{d=1} END{exit (n && d) ? 0 : 1}' "$f" \
              || { echo "::error file=$f::missing name or description in frontmatter"; fail=1; }
          done
          exit $fail

      - name: Parse all shell scripts
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash parse error"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './.vibeflow/*')
          exit $fail

  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: prep
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/plugin-distribution.test.sh
          - tests/skills-surface.test.sh
          - tests/agents-surface.test.sh
          - tests/working-memory.test.sh
          - tests/canonical-memory-read.test.sh
          - tests/canonical-memory-write.test.sh
          - tests/bootstrap.test.sh
          - tests/acceptance-and-sensors.test.sh
          - tests/ralph-loop-bounds.test.sh
          - tests/example-project.test.sh
          - tests/docs-and-lineage.test.sh
          - tests/ack-sensors-catalog.test.sh
          - tests/ack-sensors-discoverers.test.sh
          - tests/ack-sensors-inferential.test.sh
          - tests/ack-sensors-parallel.test.sh
          - tests/perf-quickwins-part-1.test.sh
          - tests/perf-quickwins-part-2.test.sh
          - tests/perf-quickwins-part-3.test.sh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure git identity (some tests scaffold local memory repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Run ${{ matrix.test }}
        run: bash ${{ matrix.test }}
