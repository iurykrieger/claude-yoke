name: yoke-drift-sense

# Phase-6 drift sensing for the host project. Runs daily and posts
# structured findings to a GitHub issue if (and only if) findings differ
# from the last run. See `docs/scheduling-strategy.md` for the rationale
# behind GitHub Actions vs. local cron / daemon backends.

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Drift-sense target"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - codebase
          - canonical-memory
          - traces

permissions:
  contents: read
  issues: write

jobs:
  drift-sense:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out host repo
        uses: actions/checkout@v4

      - name: Verify .yoke/ exists
        id: precheck
        run: |
          if [ ! -d ".yoke" ]; then
            echo "yoke_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .yoke/ directory found in repo. Skipping drift-sense."
            exit 0
          fi
          echo "yoke_present=true" >> "$GITHUB_OUTPUT"

      - name: Install Yoke plugin (or use cached)
        if: steps.precheck.outputs.yoke_present == 'true'
        run: |
          # Yoke is distributed as a Claude Code plugin; the workflow
          # invokes the plugin's drift-sense library directly. The
          # plugin is expected to be cloned at /opt/yoke (or via git
          # clone in this step). For host-project repos, point at
          # ${YOKE_PATH} or fall back to a fresh clone.
          if [ -n "${YOKE_PATH:-}" ] && [ -d "$YOKE_PATH" ]; then
            echo "YOKE_ROOT=$YOKE_PATH" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/yoke
            git clone --depth 1 https://github.com/iurykrieger/yoke.git /tmp/yoke
            echo "YOKE_ROOT=/tmp/yoke" >> "$GITHUB_ENV"
          fi

      - name: Run drift-sense
        if: steps.precheck.outputs.yoke_present == 'true'
        id: drift
        run: |
          target="${{ github.event.inputs.target || 'all' }}"
          echo "Running drift-sense target=$target"

          findings_file=".yoke/.drift-sense-findings.yaml"
          mkdir -p "$(dirname "$findings_file")"

          {
            if [ "$target" = "all" ] || [ "$target" = "canonical-memory" ]; then
              bash "$YOKE_ROOT/lib/canonical-memory/staleness-check.sh" 2>&1 || true
            fi
            if [ "$target" = "all" ] || [ "$target" = "traces" ]; then
              bash "$YOKE_ROOT/lib/canonical-memory/trace-analyzer.sh" 2>&1 || true
            fi
            # Codebase mode requires CLAUDE.md detector discovery —
            # delegated to the plugin, not run here directly to avoid
            # arbitrary command execution from CLAUDE.md content.
          } > "$findings_file"

          echo "findings_path=$findings_file" >> "$GITHUB_OUTPUT"
          echo "----- findings -----"
          cat "$findings_file"

      - name: Idempotent issue posting
        if: steps.precheck.outputs.yoke_present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          findings="${{ steps.drift.outputs.findings_path }}"
          [ -f "$findings" ] || exit 0

          # Compute a stable signature for the findings to detect change
          new_sig=$(sha256sum "$findings" | awk '{print $1}')
          last_sig_file=".yoke/.drift-sense-last-signature"
          last_sig=""
          [ -f "$last_sig_file" ] && last_sig=$(cat "$last_sig_file")

          if [ "$new_sig" = "$last_sig" ]; then
            echo "Findings unchanged since last run — not opening a new issue."
            exit 0
          fi

          # Findings have a `[]` empty-state — only post issues when
          # there are real findings.
          if grep -qE '^[[:space:]]+- target:' "$findings"; then
            title="Yoke drift-sense findings — $(date -u +%Y-%m-%d)"
            body=$(printf '## Yoke drift-sense findings\n\n```yaml\n%s\n```\n\nGenerated by `.github/workflows/yoke-drift-sense.yml` on %s.\n' "$(cat "$findings")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            gh issue create \
              --title "$title" \
              --body "$body" \
              --label "yoke-drift-sense" \
              || echo "::warning::Could not create issue (label may not exist; create label manually first)"
          else
            echo "No findings to report."
          fi

          echo "$new_sig" > "$last_sig_file"
